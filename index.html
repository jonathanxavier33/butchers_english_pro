<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Butcher's English Pro</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            background: #f8fafc; margin: 0; padding: 0; min-height: 100vh; color: #1e293b; 
        }
        #home-screen { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; 
        }
        #home-screen h1 { font-size: 2rem; color: #991b1b; margin-bottom: 6px; font-weight: 800; }
        .subtitle { color: #64748b; margin-bottom: 24px; font-size: 0.95rem; }
        .btn-start { 
            background: linear-gradient(135deg, #991b1b, #dc2626); color: white; border: none; padding: 16px 36px; 
            font-size: 1.05rem; border-radius: 9999px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(153, 27, 27, 0.3);
        }
        #game-screen { display: none; flex-direction: column; min-height: 100vh; }
        header { background: white; border-bottom: 1px solid #e2e8f0; padding: 16px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header-title { font-size: 1rem; font-weight: 700; color: #991b1b; }
        .btn-home { background: #f1f5f9; border: none; font-size: 1.1rem; cursor: pointer; padding: 8px 12px; border-radius: 12px; }
        .menu-scroll { display: flex; overflow-x: auto; padding: 12px 16px; gap: 8px; background: white; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
        .menu-btn { 
            background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 14px; border-radius: 9999px; 
            font-size: 0.8rem; font-weight: 600; color: #475569; cursor: pointer; flex-shrink: 0; 
        }
        .menu-btn.active { background: #991b1b; color: white; border-color: #991b1b; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .game-area { 
            background: white; width: 100%; max-width: 420px; padding: 24px; border-radius: 24px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9; text-align: center;
        }
        .flashcard { 
            min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; border-radius: 16px; padding: 20px; margin-bottom: 20px; background: #f8fafc; border: 2px solid #e2e8f0;
        }
        .card-word { font-size: 1.75rem; font-weight: 800; margin: 8px 0; color: #1e293b; }
        .btn-action { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; margin-top: 10px; background: #991b1b; color: white; }
        .dict-search { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 0.95rem; margin-bottom: 12px; outline: none; }
        .dict-list { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; text-align: left; }
        .dict-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px 14px; border-radius: 10px; display: flex; justify-content: space-between; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="home-screen">
        <div style="font-size: 3.5rem; margin-bottom: 8px;">🥩</div>
        <h1>Butcher's English Pro</h1>
        <p class="subtitle">Vocabulaire Technique & Professionnel en Anglais</p>
        <button class="btn-start" onclick="startApp()">Commencer l'entraînement</button>
    </div>

    <div id="game-screen">
        <header>
            <div class="header-top">
                <button class="btn-home" onclick="goHome()">🏠 Accueil</button>
                <span class="header-title">Butcher's English Pro</span>
                <span id="xp-display" style="font-weight:700; color:#991b1b; font-size:0.85rem;">0 XP</span>
            </div>
        </header>

        <nav class="menu-scroll" id="mode-menu">
            <button class="menu-btn active" onclick="setMode('flashcards')">📚 Flashcards</button>
            <button class="menu-btn" onclick="setMode('exam')">🎓 Examen</button>
            <button class="menu-btn" onclick="setMode('dict')">📖 Dictionnaire</button>
        </nav>

        <main>
            <div class="game-area" id="game-area"></div>
        </main>
    </div>

    <script>
        let xp = parseInt(localStorage.getItem('butcher_xp')) || 0;
        let currentMode = 'flashcards';
        let cardIdx = 0;

        const VOCAB = [
            { fr: "Le bœuf", en: "Beef" },
            { fr: "Le poulet", en: "Chicken" },
            { fr: "L'agneau", en: "Lamb" },
            { fr: "Le faux-filet", en: "Sirloin" },
            { fr: "L'entrecôte", en: "Ribeye" },
            { fr: "Le couteau de chef", en: "Chef's knife" },
            { fr: "Saignant", en: "Rare" },
            { fr: "À point", en: "Medium rare" },
            { fr: "Parer / Dégraisser", en: "Trim" },
            { fr: "Une livre (454g)", en: "Pound (lb)" }
        ];

        function startApp() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            updateXP();
            loadModule();
        }

        function goHome() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
        }

        function updateXP() {
            document.getElementById('xp-display').textContent = xp + " XP";
            localStorage.setItem('butcher_xp', xp);
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            loadModule();
        }

        function loadModule() {
            const area = document.getElementById('game-area');
            if (currentMode === 'flashcards') {
                const item = VOCAB[cardIdx];
                area.innerHTML = `
                    <div style="font-size:0.75rem; color:#64748b; font-weight:700; margin-bottom:8px;">FLASHCARD</div>
                    <div class="flashcard" onclick="this.innerHTML = '<div style=\\'font-size:0.75rem; color:#991b1b; font-weight:700;\\'>ANGLAIS</div><div class=\\'card-word\\' style=\\'color:#991b1b;\\'>${item.en}</div>';">
                        <div style="font-size:0.75rem; color:#64748b; font-weight:700;">FRANÇAIS</div>
                        <div class="card-word">${item.fr}</div>
                        <div style="font-size:0.75rem; color:#94a3b8; margin-top:8px;">👆 Touchez pour retourner</div>
                    </div>
                    <button class="btn-action" onclick="nextCard()">Suivant ➡️</button>
                `;
            } else if (currentMode === 'dict') {
                area.innerHTML = `
                    <div style="font-size:0.75rem; color:#64748b; font-weight:700; margin-bottom:8px;">DICTIONNAIRE</div>
                    <input type="text" class="dict-search" placeholder="Rechercher un mot..." oninput="filterDict(this.value)">
                    <div class="dict-list" id="dict-box">
                        ${VOCAB.map(i => `<div class="dict-item"><span><b>${i.fr}</b></span><span style="color:#991b1b;">${i.en}</span></div>`).join('')}
                    </div>
                `;
            } else if (currentMode === 'exam') {
                area.innerHTML = `
                    <div style="font-size:0.75rem; color:#64748b; font-weight:700; margin-bottom:8px;">MODE EXAMEN</div>
                    <p style="font-weight:600; margin:20px 0;">Traduction de : <b>${VOCAB[0].fr}</b></p>
                    <button class="btn-action" onclick="alert('Bonne réponse ! +5 XP'); xp+=5; updateXP();"> ${VOCAB[0].en} </button>
                `;
            }
        }

        function nextCard() {
            cardIdx = (cardIdx + 1) % VOCAB.length;
            xp += 1;
            updateXP();
            loadModule();
        }

        function filterDict(query) {
            const box = document.getElementById('dict-box');
            const filtered = VOCAB.filter(i => i.fr.toLowerCase().includes(query.toLowerCase()) || i.en.toLowerCase().includes(query.toLowerCase()));
            box.innerHTML = filtered.map(i => `<div class="dict-item"><span><b>${i.fr}</b></span><span style="color:#991b1b;">${i.en}</span></div>`).join('');
        }
    </script>
</body>
</html>
